[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeweave"
version = "0.1.0"
description = "A local, time-aware legal citation workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CiteWeave Contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
citeweave = "citeweave.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citeweave = ["web/index.html"]
